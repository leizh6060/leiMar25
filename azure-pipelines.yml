trigger:
- main    # Runs whenever code is pushed to the main branch

pool:
  vmImage: 'ubuntu-latest' # The build machine type

steps:
- task: Maven@4           # Built-in task for Java Maven projects
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package'      # Compiles, tests, and packages the app
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.17' # Specifies the Java version (e.g., JDK 17)

- task: CopyFiles@2       # Copies the generated JAR file for later use
  inputs:
    SourceFolder: '$(system.defaultworkingdirectory)'
    Contents: '**/target/*.jar'
    TargetFolder: '$(build.artifactstagingdirectory)'

- task: PublishBuildArtifacts@1 # Saves the JAR as a downloadable artifact
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'
    ArtifactName: 'drop'
